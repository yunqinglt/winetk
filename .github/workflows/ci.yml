name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: Terminal and TUI (sanitizers=${{ matrix.sanitizers }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build pkg-config libpng-dev zlib1g-dev python3
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWINETK_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Check command line and shell syntax
        run: |
          ./winetk --help
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q src/tui scripts tests winetk
          python3 scripts/check-repository.py
